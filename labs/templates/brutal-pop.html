<!doctype html><html lang="th"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Brutal Pop · Template</title>
<style>
:root{--bg:#FDE68A;--ink:#111;--accent:#2563EB;--pink:#FB7185;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:22px 18px 70px;
 font:16px/1.5 "Archivo Black","Trebuchet MS",system-ui,"Sarabun",sans-serif}
a{color:inherit}
.bar{max-width:1040px;margin:0 auto 24px;display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--ink);
 padding:12px 16px;box-shadow:6px 6px 0 var(--ink)}
.brand{font-weight:900;text-decoration:none;text-transform:uppercase;letter-spacing:-.5px}
nav{margin-left:auto;display:flex;gap:14px;font-size:13px;text-transform:uppercase}
main{max-width:1040px;margin:0 auto}
.hero{background:var(--pink);border:3px solid var(--ink);padding:26px 22px;box-shadow:8px 8px 0 var(--ink);margin-bottom:24px}
h1{font-size:clamp(32px,7vw,64px);line-height:.92;margin:0 0 12px;text-transform:uppercase;letter-spacing:-2px}
.hero p{margin:0 0 18px;max-width:46ch;font-family:system-ui,"Sarabun",sans-serif;font-size:15px}
.btn{display:inline-block;padding:12px 18px;background:var(--accent);color:#fff;text-decoration:none;border:3px solid var(--ink);
 text-transform:uppercase;font-size:13px;box-shadow:5px 5px 0 var(--ink);transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.card{background:#fff;border:3px solid var(--ink);padding:16px;box-shadow:6px 6px 0 var(--ink)}
.card b{display:block;font-size:32px}
.card span{font-family:system-ui,"Sarabun",sans-serif;font-size:13px}
.rows{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);padding:12px 14px;box-shadow:6px 6px 0 var(--ink);
 font-family:system-ui,"Sarabun",sans-serif}
.row .t{font-weight:800;font-family:"Archivo Black",system-ui,sans-serif}
.row .m{font-size:13px;color:#555}
.row .chip{margin-left:auto;background:var(--accent);color:#fff;border:2px solid var(--ink);padding:3px 9px;font-size:11px;text-transform:uppercase}
[data-reveal]{opacity:0;transform:translateY(14px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
[data-reveal].in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<header class="bar"><a class="brand" href="/lab/templates">Brutal Pop</a>
<nav><span>งาน</span><span>ราคา</span><span>ติดต่อ</span></nav></header>
<main>
  <section class="hero">
    <h1>ใบงาน<br/>ต้องสนุก</h1>
    <p>สีจัด เส้นหนา เงาแข็ง — เหมาะกับกิจกรรม แคมเปญ หรือหน้าที่ต้องเรียกสายตาเด็กใน 2 วินาที</p>
    <a class="btn" href="#">เริ่มเลย</a>
  </section>
  <section class="grid">
    <div class="card" data-reveal><b>24</b><span>ใบงาน</span></div>
    <div class="card" data-reveal><b>86%</b><span>ส่งตรงเวลา</span></div>
    <div class="card" data-reveal><b>4</b><span>ห้อง</span></div>
  </section>
  <section class="rows">
    <div class="row" data-reveal><div><div class="t">ใบงานคำนาม</div><div class="m">ภาษาไทย · ป.6</div></div><span class="chip">เผยแพร่</span></div>
    <div class="row" data-reveal><div><div class="t">ใบงานคำกริยา</div><div class="m">ภาษาไทย · ป.6</div></div><span class="chip">เผยแพร่</span></div>
    <div class="row" data-reveal><div><div class="t">อ่านจับใจความ</div><div class="m">ภาษาไทย · ม.1</div></div><span class="chip">ร่าง</span></div>
  </section>
</main>
<script>
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('[data-reveal]').forEach((el,i)=>{el.style.transitionDelay=(i*60)+'ms';io.observe(el)});
// magnetic ปุ่มหลัก
const btn=document.querySelector('.btn');
btn.addEventListener('pointermove',e=>{const r=btn.getBoundingClientRect();
 const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 btn.style.transform=`translate(${dx*.12}px,${dy*.12}px)`;});
btn.addEventListener('pointerleave',()=>{btn.style.transform=''});
</script></body></html>
