<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>คอลเลกชันเทมเพลต · Smart Worksheet</title>
<style>
  :root{
    --bg:#07040E; --ink:#F6F1FF; --muted:#B3A2D6; --line:rgba(255,255,255,.14);
    --accent:#8B5CF6; --ease:cubic-bezier(.32,.72,0,1);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; min-height:100vh; color:var(--ink); padding:24px 18px 80px;
    font:16px/1.6 system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;
    background:
      radial-gradient(80% 55% at 50% -10%, rgba(139,92,246,.28), rgba(7,4,14,0) 68%),
      var(--bg);
  }
  a{ color:inherit; }
  header{ max-width:1180px; margin:0 auto 22px; }
  .back{ display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-size:13.5px; font-weight:600;
    padding:9px 14px; border-radius:999px; background:rgba(20,12,36,.7); border:1px solid var(--line); margin-bottom:16px; }
  h1{ font-size:clamp(24px,4vw,38px); margin:0 0 8px; letter-spacing:-.9px; }
  .lead{ color:var(--muted); margin:0; max-width:70ch; font-size:14.5px; }
  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 4px; }
  .filters button{
    font:600 12.5px/1 inherit; color:#D9CCF6; background:rgba(255,255,255,.06);
    border:1px solid var(--line); padding:9px 14px; border-radius:999px; cursor:pointer;
    transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
  }
  .filters button[aria-pressed="true"]{ background:#8B5CF6; color:#12081F; border-color:transparent; }
  main{ max-width:1180px; margin:0 auto; display:grid; gap:22px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  .tpl{
    border:1px solid var(--line); border-radius:20px; overflow:hidden;
    background:linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    box-shadow:0 24px 60px -34px rgba(0,0,0,.9);
    display:flex; flex-direction:column;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .tpl:hover{ transform:translateY(-3px); box-shadow:0 30px 70px -34px rgba(0,0,0,.95); }
  .shot{ position:relative; height:230px; background:#0C0818; overflow:hidden; }
  .shot iframe{
    position:absolute; top:0; left:0; width:1280px; height:900px; border:0;
    transform:scale(.26); transform-origin:top left; pointer-events:none;
    filter:saturate(1.02);
  }
  .shot .fade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,4,14,0) 55%, rgba(7,4,14,.7) 100%); }
  .body{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .top{ display:flex; align-items:baseline; gap:8px; }
  h2{ font-size:17px; margin:0; letter-spacing:-.3px; }
  .thai{ color:var(--muted); font-size:12.5px; }
  .swatches{ margin-left:auto; display:flex; gap:4px; }
  .swatches i{ width:14px; height:14px; border-radius:50%; border:1px solid rgba(255,255,255,.35); }
  .tags{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag{ font-size:11px; font-weight:700; letter-spacing:.02em; padding:4px 9px; border-radius:999px;
    background:rgba(255,255,255,.07); border:1px solid var(--line); color:#DCD2F3; }
  .tag.motion{ background:rgba(123,224,176,.14); border-color:rgba(123,224,176,.3); color:#A6F3CE; }
  .best{ color:var(--muted); font-size:13px; margin:2px 0 0; }
  .actions{ margin-top:auto; display:flex; gap:10px; padding-top:10px; }
  .actions a{
    flex:1; text-align:center; text-decoration:none; font-weight:700; font-size:13.5px;
    padding:11px 12px; border-radius:12px; transition:transform .2s var(--ease), background .2s var(--ease);
  }
  .actions .open{ background:linear-gradient(145deg,#E7DBFF,#8B5CF6); color:#12081F; }
  .actions .src{ background:rgba(255,255,255,.07); border:1px solid var(--line); color:var(--ink); }
  .actions a:active{ transform:scale(.97); }
  .empty{ color:var(--muted); }
  @media (max-width:520px){ .shot iframe{ transform:scale(.30); } .shot{ height:200px; } }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<header>
  <a class="back" href="/#/">กลับไปใบงานของฉัน</a>
  <h1>คอลเลกชันเทมเพลต</h1>
  <p class="lead">หน้าเว็บตัวอย่าง 6 สไตล์ — ใช้เนื้อหาชุดเดียวกันเพื่อเทียบกันได้ตรง ๆ เปิดดูเต็มหน้าได้ทันที
    แล้วหยิบสไตล์ที่ใช่ไปต่อยอดในงานจริง</p>
  <div class="filters" id="filters"></div>
</header>
<main id="grid"></main>

<script>
const state = { all: [], filter: null };

async function load() {
  const res = await fetch('manifest.json', { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  state.all = data.templates || [];
  renderFilters();
  render();
}

function tagSet() {
  const set = new Set();
  for (const t of state.all) for (const tag of t.tags || []) set.add(tag);
  return [...set].sort();
}

function renderFilters() {
  const host = document.getElementById('filters');
  host.innerHTML = '';
  const mk = (label, value) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.setAttribute('aria-pressed', String(state.filter === value));
    b.onclick = () => { state.filter = state.filter === value ? null : value; renderFilters(); render(); };
    host.appendChild(b);
  };
  mk('ทั้งหมด', null);
  for (const tag of tagSet()) mk(tag, tag);
}

function render() {
  const grid = document.getElementById('grid');
  const list = state.all.filter((t) => !state.filter || (t.tags || []).includes(state.filter));
  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = '<p class="empty">ไม่พบเทมเพลตที่ตรงกับตัวกรอง</p>';
    return;
  }
  for (const t of list) {
    const el = document.createElement('article');
    el.className = 'tpl';
    const tokens = t.tokens || {};
    el.innerHTML = `
      <div class="shot">
        <iframe src="${t.file}" loading="lazy" tabindex="-1" title="ตัวอย่าง ${t.name}"></iframe>
        <div class="fade"></div>
      </div>
      <div class="body">
        <div class="top">
          <h2>${t.name}</h2>
          <span class="thai">${t.thai || ''}</span>
          <span class="swatches">
            <i style="background:${tokens.bg || '#111'}"></i>
            <i style="background:${tokens.ink || '#fff'}"></i>
            <i style="background:${tokens.accent || '#8B5CF6'}"></i>
          </span>
        </div>
        <div class="tags">
          ${(t.tags || []).map((x) => `<span class="tag">${x}</span>`).join('')}
          ${(t.motion || []).map((x) => `<span class="tag motion">${x}</span>`).join('')}
        </div>
        <p class="best">${t.bestFor || ''}</p>
        <div class="actions">
          <a class="open" href="${t.file}" target="_blank" rel="noopener">เปิดเต็มหน้า</a>
          <a class="src" href="/lab/templates/${t.file}" download>ดาวน์โหลด HTML</a>
        </div>
      </div>`;
    grid.appendChild(el);
  }
}

load().catch((err) => {
  document.getElementById('grid').innerHTML = `<p class="empty">โหลดคอลเลกชันไม่สำเร็จ: ${err.message}</p>`;
});
</script>
</body>
</html>
